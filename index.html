<!doctype html>
<html lang="pt-BR" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="google" content="notranslate" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0a0907" />
    <meta name="application-name" content="Gestão 360" />
    <meta name="apple-mobile-web-app-title" content="Gestão 360" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    
    <!-- Favicons Oficiais Gestão 360 -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    
    <!-- PWA Web App Manifest (Instalação no Computador e Celular) -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Open Graph / Prévia de Compartilhamento -->
    <meta property="og:title" content="Gestão 360 - Sistema de Gestão Pública" />
    <meta property="og:description" content="Plataforma integrada de inteligência e gestão para a administração pública municipal." />
    <meta property="og:image" content="/pwa-512x512.png" />
    <meta property="og:type" content="website" />

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Atkinson+Hyperlegible+Next:wght@400;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <title>Gestão 360</title>
    <script>
      (function () {
        var path = window.location.pathname || '';
        var host = window.location.hostname || '';
        var isFamiliaSubdomain = /^(familia|pais)\./i.test(host);
        var isFamilia =
          isFamiliaSubdomain ||
          path === '/familia' ||
          path === '/pais' ||
          path === '/educacao/familia' ||
          path.indexOf('/familia/') === 0;
        if (!isFamilia) return;

        var manifestHref = isFamiliaSubdomain ? '/manifest-familia-root.json' : '/manifest-familia.json';

        function applyFamiliaMeta() {
          document.title = 'Família e Escola';
          var setMeta = function (name, content) {
            var el = document.querySelector('meta[name="' + name + '"]');
            if (el) el.setAttribute('content', content);
          };
          setMeta('application-name', 'Família e Escola');
          setMeta('apple-mobile-web-app-title', 'Família e Escola');
          setMeta('theme-color', '#4f46e5');

          var appleIcon = document.querySelector('link[rel="apple-touch-icon"]');
          if (appleIcon) appleIcon.setAttribute('href', '/familia-192x192.png');

          document.querySelectorAll('link[rel="icon"]').forEach(function (el) {
            el.setAttribute('href', '/familia-icon.svg');
            el.setAttribute('type', 'image/svg+xml');
          });

          var manifests = document.querySelectorAll('link[rel="manifest"]');
          if (manifests.length === 0) {
            var link = document.createElement('link');
            link.rel = 'manifest';
            link.href = manifestHref;
            document.head.appendChild(link);
          } else {
            manifests.forEach(function (el, idx) {
              if (idx === 0) el.setAttribute('href', manifestHref);
              else el.remove();
            });
          }
        }

        applyFamiliaMeta();
        document.addEventListener('DOMContentLoaded', applyFamiliaMeta);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
